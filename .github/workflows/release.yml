name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to create or update, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            core/package-lock.json
            desktop/package-lock.json

      - name: Install core dependencies
        run: npm ci --prefix core

      - name: Install desktop dependencies
        run: npm ci --prefix desktop

      - name: Build Windows installer
        run: npm run desktop-build

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: Vibebud ${{ github.event.inputs.tag_name || github.ref_name }}
          generate_release_notes: true
          files: |
            desktop/dist/vibebud-desktop-setup.exe
