name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to create or update, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

env:
  CSC_IDENTITY_AUTO_DISCOVERY: false

jobs:
  desktop:
    name: Build ${{ matrix.name }} desktop package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            build_script: desktop-build:win
            files: |
              desktop/dist/vibebud-desktop-setup.exe
            artifact: vibebud-desktop-windows
          - name: macOS
            os: macos-13
            build_script: desktop-build:mac
            files: |
              desktop/dist/vibebud-desktop.dmg
            artifact: vibebud-desktop-macos
          - name: Linux
            os: ubuntu-latest
            build_script: desktop-build:linux
            files: |
              desktop/dist/vibebud-desktop.AppImage
            artifact: vibebud-desktop-linux

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            core/package-lock.json
            desktop/package-lock.json

      - name: Install core dependencies
        run: npm ci --prefix core

      - name: Install desktop dependencies
        run: npm ci --prefix desktop

      - name: Build desktop package
        run: npm run ${{ matrix.build_script }}

      - name: List desktop package outputs
        run: node -e "const fs = require('fs'); for (const file of fs.readdirSync('desktop/dist')) { const stat = fs.statSync(`desktop/dist/${file}`); console.log(`${stat.size} ${file}`); }"

      - name: Upload desktop package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: desktop

    steps:
      - name: Download desktop packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: Vibebud ${{ github.event.inputs.tag_name || github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
