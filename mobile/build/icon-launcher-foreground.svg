<!-- Adaptive-icon foreground: face features only on transparent ground.
     The lavender adaptive background (drawable/ic_launcher_background.xml,
     #EFE5FF) shows through, giving a square-with-face look that matches
     the user's request: NOT a ball — a flat tile with the buddy's face.
     Sizing fits the 72dp safe zone of Android's 108dp adaptive canvas. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- rosy cheeks -->
  <g fill="#ffb3c7" opacity="0.85">
    <ellipse cx="78"  cy="158" rx="14" ry="9"/>
    <ellipse cx="178" cy="158" rx="14" ry="9"/>
  </g>
  <!-- eyes: round pupils with sparkle highlights -->
  <g fill="#6D3EDC">
    <circle cx="100" cy="124" r="16"/>
    <circle cx="156" cy="124" r="16"/>
  </g>
  <g fill="#ffffff">
    <circle cx="105" cy="119" r="5"/>
    <circle cx="161" cy="119" r="5"/>
    <circle cx="96"  cy="129" r="2.5"/>
    <circle cx="152" cy="129" r="2.5"/>
  </g>
  <!-- smile -->
  <path d="M 102 158 Q 128 182 154 158"
        stroke="#6D3EDC" stroke-width="11"
        stroke-linecap="round" fill="none"/>
</svg>
